# Throwaway Postgres for API tests. Never point tests at the shared dev database.
# The project name includes the port, so worktrees on different ports do not collide.
name: potli-test-${TEST_DB_PORT:-54329}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: potli_test
      POSTGRES_PASSWORD: potli_test
      POSTGRES_DB: potli_test
    ports:
      - '${TEST_DB_PORT:-54329}:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U potli_test -d potli_test']
      interval: 2s
      timeout: 3s
      retries: 20
